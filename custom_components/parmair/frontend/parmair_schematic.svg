<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 15 750 438" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18202c" />
      <stop offset="100%" stop-color="#10151e" />
    </linearGradient>

    <!-- Duct Flow Gradients (Finnish HVAC / LVI Standard Colors) -->
    <!-- Fresh Air: Finnish LVI Green -->
    <linearGradient id="freshAirGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.9" />
    </linearGradient>

    <!-- Exhaust Air: Finnish LVI Yellow / Amber -->
    <linearGradient id="exhaustAirGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.9" />
    </linearGradient>

    <!-- Waste Air: Finnish LVI Blue / Cool Slate -->
    <linearGradient id="wasteAirGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.9" />
    </linearGradient>

    <!-- Supply Air: Finnish LVI Warm Red / Coral -->
    <linearGradient id="supplyAirGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.9" />
    </linearGradient>

    <!-- Core Exchanger Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Crossing internal flow streams through LTO core -->
    <!-- Fresh (Top-Left) -> Supply (Bottom-Right) -->
    <linearGradient id="freshCoreFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <!-- Exhaust (Top-Right) -> Waste (Bottom-Left) -->
    <linearGradient id="exhaustCoreFlow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter for Active Heater -->
    <filter id="heaterGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glow Filter for Arrows -->
    <filter id="arrowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Plates -->
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="25" y="15" width="750" height="438" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Outer Machine Chassis -->
  <rect x="200" y="52" width="400" height="366" rx="14" fill="#0b0f14" stroke="#475569" stroke-width="2.5" />
  <rect x="214" y="66" width="372" height="338" rx="10" fill="#131922" stroke="#1e293b" stroke-width="1.5" />

  <!-- ==================== DUCTS & DIRECTION ARROWS ==================== -->

  <!-- 1) TOP-LEFT: ULKOILMA (Fresh outdoor air in - LVI Green) -->
  <path d="M 35 120 L 200 120" stroke="#10b981" stroke-width="48" stroke-linecap="round" fill="none" opacity="0.16" />
  <path d="M 35 120 L 200 120" stroke="url(#freshAirGrad)" stroke-width="7" stroke-linecap="round" fill="none" />
  <!-- 3 Symmetrical Chevrons >>> ending BEFORE the badge with 16px gap (tips at 66, 80, 94) -->
  <path d="M 54 108 L 66 120 L 54 132" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)" />
  <path d="M 68 108 L 80 120 L 68 132" fill="none" stroke="#34d399" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)" />
  <path d="M 82 108 L 94 120 L 82 132" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)" />
  <g transform="translate(155, 120)">
    <rect x="-45" y="-22" width="90" height="44" rx="9" fill="rgba(11, 15, 20, 0.96)" stroke="#10b981" stroke-width="1.8" filter="url(#plateShadow)" />
    <text x="0" y="-4" fill="#94a3b8" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Ulkoilma</text>
    <text x="0" y="15" fill="#34d399" font-size="16.5" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">-- °C</text>
  </g>
  <g transform="translate(230, 93)">
    <rect x="0" y="0" width="12" height="54" rx="2" fill="#059669" opacity="0.85" />
    <line x1="2" y1="5" x2="10" y2="49" stroke="#34d399" stroke-width="1.5" />
    <line x1="10" y1="5" x2="2" y2="49" stroke="#34d399" stroke-width="1.5" />
    <text x="6" y="70" fill="#94a3b8" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">G4</text>
  </g>

  <!-- 2) TOP-RIGHT: POISTOILMA (Exhaust room air in - LVI Yellow) -->
  <path d="M 765 120 L 600 120" stroke="#fbbf24" stroke-width="48" stroke-linecap="round" fill="none" opacity="0.16" />
  <path d="M 765 120 L 600 120" stroke="url(#exhaustAirGrad)" stroke-width="7" stroke-linecap="round" fill="none" />
  <!-- 3 Symmetrical Chevrons <<< ending BEFORE the badge with 16px gap (tips at 734, 720, 706) -->
  <path d="M 746 108 L 734 120 L 746 132" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)" />
  <path d="M 732 108 L 720 120 L 732 132" fill="none" stroke="#fbbf24" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)" />
  <path d="M 718 108 L 706 120 L 718 132" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)" />
  <g transform="translate(645, 120)">
    <rect x="-45" y="-22" width="90" height="44" rx="9" fill="rgba(11, 15, 20, 0.96)" stroke="#fbbf24" stroke-width="1.8" filter="url(#plateShadow)" />
    <text x="0" y="-4" fill="#94a3b8" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Poistoilma</text>
    <text x="0" y="15" fill="#fbbf24" font-size="16.5" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">-- °C</text>
  </g>
  <g transform="translate(558, 93)">
    <rect x="0" y="0" width="12" height="54" rx="2" fill="#d97706" opacity="0.85" />
    <line x1="2" y1="5" x2="10" y2="49" stroke="#fbbf24" stroke-width="1.5" />
    <line x1="10" y1="5" x2="2" y2="49" stroke="#fbbf24" stroke-width="1.5" />
    <text x="6" y="70" fill="#94a3b8" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">G4</text>
  </g>

  <!-- ==================== INTERNAL AIRFLOW THROUGH LTO ==================== -->
  <path d="M 200 120 C 270 120, 320 150, 400 235 C 470 300, 520 348, 600 348"
        stroke="url(#freshCoreFlow)" stroke-width="5.5" stroke-dasharray="8,5" fill="none" opacity="0.85" />
  <path d="M 600 120 C 530 120, 480 150, 400 235 C 330 300, 280 348, 200 348"
        stroke="url(#exhaustCoreFlow)" stroke-width="5.5" stroke-dasharray="8,5" fill="none" opacity="0.85" />

  <!-- ==================== CENTER HEAT EXCHANGER CORE (LTO) ==================== -->
  <g transform="translate(400, 235)">
    <polygon points="0,-106 106,0 0,106 -106,0" fill="#0f172a" stroke="#009fe3" stroke-width="2" />
    <!-- Lamellas -->
    <line x1="-62" y1="-44" x2="62" y2="44" stroke="#334155" stroke-width="1.5" />
    <line x1="-44" y1="-62" x2="44" y2="62" stroke="#334155" stroke-width="1.5" />
    <line x1="-24" y1="-82" x2="82" y2="24" stroke="#334155" stroke-width="1.5" />
    <line x1="-82" y1="-24" x2="24" y2="82" stroke="#334155" stroke-width="1.5" />

    <rect x="-88" y="-46" width="176" height="92" rx="12" fill="#090d12" stroke="#009fe3" stroke-width="1.8" filter="url(#plateShadow)" />
    <text x="0" y="-18" fill="#ffffff" font-size="16.5" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">LTO: -- %</text>
    <text x="0" y="7" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <tspan fill="#94a3b8" font-size="13.5" font-weight="600">Lämpötila: </tspan>
      <tspan fill="#34d399" font-size="15.5" font-weight="bold">-- °C</tspan>
    </text>
    <text x="0" y="30" fill="#38bdf8" font-size="14.5" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Talteenotto: -- W</text>
  </g>

  <!-- ==================== 3) BOTTOM-LEFT: JÄTEILMA ==================== -->
  <g transform="translate(315, 348)">
    <circle cx="0" cy="0" r="23" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8" />
    <circle cx="0" cy="0" r="5" fill="#60a5fa" />
    <path d="M 0,-17 Q 5,-7 0,0 Q -5,-7 0,-17" fill="#60a5fa" opacity="0.8" />
    <path d="M 17,0 Q 7,5 0,0 Q 7,-5 17,0" fill="#60a5fa" opacity="0.8" />
    <path d="M 0,17 Q -5,7 0,0 Q 5,7 0,17" fill="#60a5fa" opacity="0.8" />
    <path d="M -17,0 Q -7,-5 0,0 Q -7,5 -17,0" fill="#60a5fa" opacity="0.8" />
    <text x="0" y="32" fill="#94a3b8" font-size="12.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Poistopuhallin</text>
    <text x="0" y="50" fill="#60a5fa" font-size="15.5" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">-- %</text>
  </g>
  <path d="M 200 348 L 35 348" stroke="#3b82f6" stroke-width="48" stroke-linecap="round" fill="none" opacity="0.16" />
  <path d="M 200 348 L 35 348" stroke="url(#wasteAirGrad)" stroke-width="7" stroke-linecap="round" fill="none" />
  <g transform="translate(155, 348)">
    <rect x="-45" y="-22" width="90" height="44" rx="9" fill="rgba(11, 15, 20, 0.96)" stroke="#3b82f6" stroke-width="1.8" filter="url(#plateShadow)" />
    <text x="0" y="-4" fill="#94a3b8" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Jäteilma</text>
    <text x="0" y="15" fill="#60a5fa" font-size="16.5" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">-- °C</text>
  </g>
  <!-- 3 Symmetrical Chevrons <<< starting AFTER the badge with 16px gap (tips at 82, 68, 54) -->
  <path d="M 94 336 L 82 348 L 94 360" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)" />
  <path d="M 80 336 L 68 348 L 80 360" fill="none" stroke="#60a5fa" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)" />
  <path d="M 66 336 L 54 348 L 66 360" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)" />

  <!-- ==================== 4) BOTTOM-RIGHT: TULOILMA ==================== -->
  <g transform="translate(485, 348)">
    <circle cx="0" cy="0" r="23" fill="#1e293b" stroke="#ef4444" stroke-width="1.8" />
    <circle cx="0" cy="0" r="5" fill="#f87171" />
    <path d="M 0,-17 Q 5,-7 0,0 Q -5,-7 0,-17" fill="#f87171" opacity="0.8" />
    <path d="M 17,0 Q 7,5 0,0 Q 7,-5 17,0" fill="#f87171" opacity="0.8" />
    <path d="M 0,17 Q -5,7 0,0 Q 5,7 0,17" fill="#f87171" opacity="0.8" />
    <path d="M -17,0 Q -7,-5 0,0 Q -7,5 -17,0" fill="#f87171" opacity="0.8" />
    <text x="0" y="32" fill="#94a3b8" font-size="12.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Tulopuhallin</text>
    <text x="0" y="50" fill="#f87171" font-size="15.5" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">-- %</text>
  </g>

  <!-- F7 (ePM1) Hienosuodatin -->
  <g transform="translate(530, 321)">
    <rect x="0" y="0" width="12" height="54" rx="2" fill="#0284c7" opacity="0.85" />
    <line x1="2" y1="5" x2="10" y2="49" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="10" y1="5" x2="2" y2="49" stroke="#38bdf8" stroke-width="1.5" />
    <text x="6" y="70" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">F7</text>
  </g>

  <!-- Kaksirivinen Lämmitin-laatikko -->
  <g transform="translate(566, 276)">
    <rect x="-38" y="-19" width="76" height="38" rx="8" fill="rgba(24, 21, 18, 0.96)" stroke="#ea580c" stroke-width="1.6" filter="url(#plateShadow)" />
    <text x="0" y="-3" fill="#fb923c" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Lämmitin</text>
    <text x="0" y="13" fill="#f97316" font-size="14.5" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">0 W</text>
  </g>

  <!-- Post-Heater Coil Element -->
  <g transform="translate(568, 348)" id="heater_coil">
    <rect x="-9" y="-22" width="18" height="44" rx="4" fill="#181512" stroke="#ea580c" stroke-width="1.5" />
    <path d="M -4,-15 L 4,-9 L -4,-3 L 4,3 L -4,9 L 4,15" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" id="heater_path" />
  </g>

  <path d="M 600 348 L 765 348" stroke="#ef4444" stroke-width="48" stroke-linecap="round" fill="none" opacity="0.16" />
  <path d="M 600 348 L 765 348" stroke="url(#supplyAirGrad)" stroke-width="7" stroke-linecap="round" fill="none" />
  <g transform="translate(645, 348)">
    <rect x="-45" y="-22" width="90" height="44" rx="9" fill="rgba(11, 15, 20, 0.96)" stroke="#ef4444" stroke-width="1.8" filter="url(#plateShadow)" />
    <text x="0" y="-4" fill="#94a3b8" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Tuloilma</text>
    <text x="0" y="15" fill="#f87171" font-size="16.5" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">-- °C</text>
  </g>
  <!-- 3 Symmetrical Chevrons >>> starting AFTER the badge with 16px gap (tips at 718, 732, 746) -->
  <path d="M 706 336 L 718 348 L 706 360" fill="none" stroke="#f87171" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)" />
  <path d="M 720 336 L 732 348 L 720 360" fill="none" stroke="#f87171" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)" />
  <path d="M 734 336 L 746 348 L 734 360" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)" />
</svg>
