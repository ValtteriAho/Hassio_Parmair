<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e242c" />
      <stop offset="100%" stop-color="#14181d" />
    </linearGradient>

    <!-- Duct Flow Gradients -->
    <!-- Fresh Air: Cold blue -->
    <linearGradient id="freshAirGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Supply Air: Warm orange -->
    <linearGradient id="supplyAirGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.9" />
    </linearGradient>

    <!-- Exhaust Air: Room warm coral -->
    <linearGradient id="exhaustAirGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.9" />
    </linearGradient>

    <!-- Waste Air: Chilled exhaust grey-blue -->
    <linearGradient id="wasteAirGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.8" />
    </linearGradient>

    <!-- Core Exchanger Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glow Filter for Active Heater -->
    <filter id="heaterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Outer Machine Casing -->
  <rect x="220" y="70" width="360" height="340" rx="12" fill="#0b0f14" stroke="#475569" stroke-width="2.5" />

  <!-- Inner Insulation Border -->
  <rect x="232" y="82" width="336" height="316" rx="8" fill="#131922" stroke="#1e293b" stroke-width="1.5" />

  <!-- DUCT 1: Top-Left -> Ulkoilma (Fresh Air in) -->
  <path d="M 60 130 L 220 130" stroke="#0284c7" stroke-width="38" stroke-linecap="round" fill="none" opacity="0.15" />
  <path d="M 60 130 L 220 130" stroke="url(#freshAirGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
  <polygon points="215,122 230,130 215,138" fill="#38bdf8" />

  <!-- DUCT 2: Top-Right -> Poistoilma (Exhaust Air in from home) -->
  <path d="M 740 130 L 580 130" stroke="#ef4444" stroke-width="38" stroke-linecap="round" fill="none" opacity="0.15" />
  <path d="M 740 130 L 580 130" stroke="url(#exhaustAirGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
  <polygon points="585,122 570,130 585,138" fill="#f87171" />

  <!-- DUCT 3: Bottom-Right -> Jäteilma (Waste Air out) -->
  <path d="M 580 350 L 740 350" stroke="#64748b" stroke-width="38" stroke-linecap="round" fill="none" opacity="0.15" />
  <path d="M 580 350 L 740 350" stroke="url(#wasteAirGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
  <polygon points="730,342 745,350 730,358" fill="#94a3b8" />

  <!-- DUCT 4: Bottom-Left -> Tuloilma (Supply Air out to home) -->
  <path d="M 220 350 L 60 350" stroke="#f59e0b" stroke-width="38" stroke-linecap="round" fill="none" opacity="0.15" />
  <path d="M 220 350 L 60 350" stroke="url(#supplyAirGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
  <polygon points="70,342 55,350 70,358" fill="#f59e0b" />

  <!-- Airflow Channels inside unit (Diagonal cross paths) -->
  <path d="M 230 130 C 310 130, 310 350, 230 350" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" fill="none" opacity="0.5" />
  <path d="M 570 130 C 490 130, 490 350, 570 350" stroke="#f87171" stroke-width="3" stroke-dasharray="6,4" fill="none" opacity="0.5" />

  <!-- CENTER: Heat Recovery Exchanger Core (Diamond) -->
  <g transform="translate(400, 240)">
    <polygon points="0,-100 100,0 0,100 -100,0" fill="url(#coreGrad)" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="-60" y1="-40" x2="60" y2="40" stroke="#334155" stroke-width="1.5" />
    <line x1="-40" y1="-60" x2="40" y2="60" stroke="#334155" stroke-width="1.5" />
    <line x1="-20" y1="-80" x2="80" y2="20" stroke="#334155" stroke-width="1.5" />
    <line x1="-80" y1="-20" x2="20" y2="80" stroke="#334155" stroke-width="1.5" />

    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#009fe3" stroke-width="2" />
    <path d="M -16,-6 A 16,16 0 0,1 16,-6" fill="none" stroke="#009fe3" stroke-width="3" stroke-linecap="round" />
    <polygon points="14,-12 22,-6 14,0" fill="#009fe3" />
    <path d="M 16,6 A 16,16 0 0,1 -16,6" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <polygon points="-14,12 -22,6 -14,0" fill="#f59e0b" />
  </g>

  <!-- Supply Fan (Left lower bay) -->
  <g transform="translate(265, 350)">
    <circle cx="0" cy="0" r="24" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#38bdf8" />
    <path d="M 0,-18 Q 6,-9 0,0 Q -6,-9 0,-18" fill="#38bdf8" opacity="0.8" />
    <path d="M 18,0 Q 9,6 0,0 Q 9,-6 18,0" fill="#38bdf8" opacity="0.8" />
    <path d="M 0,18 Q -6,9 0,0 Q 6,9 0,18" fill="#38bdf8" opacity="0.8" />
    <path d="M -18,0 Q -9,-6 0,0 Q -9,6 -18,0" fill="#38bdf8" opacity="0.8" />
    <text x="0" y="36" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Tulopuhallin</text>
  </g>

  <!-- Exhaust Fan (Right lower bay) -->
  <g transform="translate(535, 350)">
    <circle cx="0" cy="0" r="24" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#f87171" />
    <path d="M 0,-18 Q 6,-9 0,0 Q -6,-9 0,-18" fill="#f87171" opacity="0.8" />
    <path d="M 18,0 Q 9,6 0,0 Q 9,-6 18,0" fill="#f87171" opacity="0.8" />
    <path d="M 0,18 Q -6,9 0,0 Q 6,9 0,18" fill="#f87171" opacity="0.8" />
    <path d="M -18,0 Q -9,-6 0,0 Q -9,6 -18,0" fill="#f87171" opacity="0.8" />
    <text x="0" y="36" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Poistopuhallin</text>
  </g>

  <!-- HEATING ELEMENT: Located right in front of supply outlet (after recovery core) -->
  <g transform="translate(185, 350)" id="heater_coil">
    <rect x="-18" y="-28" width="36" height="56" rx="4" fill="#1e1b18" stroke="#f97316" stroke-width="1.5" />
    <path d="M -8,-20 L 8,-12 L -8,-4 L 8,4 L -8,12 L 8,20" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#heaterGlow)" />
    <path d="M 14,-14 L 18,-16 M 14,0 L 19,0 M 14,14 L 18,16" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="-34" fill="#fb923c" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Jälkilämmitin</text>
  </g>
</svg>
