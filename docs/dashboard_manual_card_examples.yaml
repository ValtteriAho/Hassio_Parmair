# 0) Parmair MAC Scandinavian Schematic Card (with Heating Element & Flow)
# -------------------------------------------------------------------------
# Kopioi tämä koodi Home Assistantin "Lisää kortti -> Manuaalinen (Manual)" -kohtaan.
# Kuva löytyy automaattisesti integraation rekisteröimästä polusta '/parmair/parmair_schematic.svg'.
type: vertical-stack
cards:
  - type: custom:mushroom-chips-card
    alignment: justify
    chips:
      - type: entity
        entity: select.parmair_mac_control_state
        icon: mdi:home-outline
        name: Tila
      - type: entity
        entity: sensor.parmair_mac_actual_fan_speed
        icon: mdi:fan
        name: Nopeus
      - type: entity
        entity: sensor.parmair_mac_total_power
        icon: mdi:flash
      - type: entity
        entity: sensor.parmair_mac_total_energy
        icon: mdi:counter
      - type: entity
        entity: sensor.parmair_mac_filter_status
        icon: mdi:air-filter

  - type: picture-elements
    image: /parmair/parmair_schematic.svg
    elements:
      # --- LÄMPÖTILAT KANAVISSA ---
      # 1) Ulkoilma (Fresh air in) - Ylävasen kanava
      - type: state-label
        entity: sensor.parmair_mac_fresh_air_temperature
        style:
          top: 25%
          left: 15%
          font-weight: bold
          font-size: 15px
          color: "#38bdf8"
          background: "rgba(15, 23, 42, 0.85)"
          padding: 4px 8px
          border-radius: 6px
          border: "1px solid #0284c7"

      # 2) Poistoilma (Exhaust from rooms) - Yläoikea kanava
      - type: state-label
        entity: sensor.parmair_mac_exhaust_air_temperature
        style:
          top: 25%
          left: 85%
          font-weight: bold
          font-size: 15px
          color: "#f87171"
          background: "rgba(15, 23, 42, 0.85)"
          padding: 4px 8px
          border-radius: 6px
          border: "1px solid #ef4444"

      # 3) LTO-kennon jälkeen ennen lämmitintä (Recovery intermediate)
      - type: state-label
        entity: sensor.parmair_mac_supply_air_temperature_after_recovery
        prefix: "LTO: "
        style:
          top: 61%
          left: 38%
          font-size: 12px
          font-weight: 600
          color: "#38bdf8"
          background: "rgba(15, 23, 42, 0.9)"
          padding: 3px 6px
          border-radius: 4px
          border: "1px solid #0284c7"

      # 4) Tuloilma huoneisiin (Supply out to home) - Alavasen kanava
      - type: state-label
        entity: sensor.parmair_mac_supply_air_temperature
        style:
          top: 74%
          left: 15%
          font-weight: bold
          font-size: 15px
          color: "#f59e0b"
          background: "rgba(15, 23, 42, 0.85)"
          padding: 4px 8px
          border-radius: 6px
          border: "1px solid #ea580c"

      # 5) Jäteilma ulos (Waste air out) - Alaoikea kanava
      - type: state-label
        entity: sensor.parmair_mac_waste_air_temperature
        style:
          top: 74%
          left: 85%
          font-weight: bold
          font-size: 15px
          color: "#94a3b8"
          background: "rgba(15, 23, 42, 0.85)"
          padding: 4px 8px
          border-radius: 6px
          border: "1px solid #475569"

      # --- LÄMMÖNTALTEENOTTO (LTO KESKUS) ---
      - type: state-label
        entity: sensor.parmair_mac_heat_recovery_efficiency
        prefix: "LTO: "
        style:
          top: 47%
          left: 50%
          font-weight: bold
          font-size: 14px
          color: "#ffffff"

      - type: state-label
        entity: sensor.parmair_mac_heat_recovery_power
        prefix: "Talteenotto: "
        style:
          top: 53%
          left: 50%
          font-size: 13px
          font-weight: 600
          color: "#38bdf8"

      # --- JÄLKILÄMMITIN (HEATING ELEMENT) ---
      - type: state-label
        entity: sensor.parmair_mac_post_heater_power
        prefix: "Lämmitin: "
        style:
          top: 64%
          left: 24.5%
          font-size: 11px
          font-weight: bold
          color: "#fb923c"
          background: "rgba(30, 27, 24, 0.9)"
          padding: 2px 6px
          border-radius: 4px
          border: "1px solid #ea580c"

  # Käyttötilojen pikapainikkeet Parmairin ohjaintyyliin
  - type: grid
    columns: 5
    square: false
    cards:
      - type: button
        name: Poissa
        icon: mdi:home-export-outline
        tap_action:
          action: call-service
          service: select.select_option
          target:
            entity_id: select.parmair_mac_control_state
          data:
            option: Away

      - type: button
        name: Kotona
        icon: mdi:home
        tap_action:
          action: call-service
          service: select.select_option
          target:
            entity_id: select.parmair_mac_control_state
          data:
            option: Home

      - type: button
        name: Tehostus
        icon: mdi:fan-chevron-up
        tap_action:
          action: call-service
          service: select.select_option
          target:
            entity_id: select.parmair_mac_control_state
          data:
            option: Boost

      - type: button
        name: Sauna
        icon: mdi:radiator
        tap_action:
          action: call-service
          service: select.select_option
          target:
            entity_id: select.parmair_mac_control_state
          data:
            option: Sauna

      - type: button
        name: Takka
        icon: mdi:fire
        tap_action:
          action: call-service
          service: select.select_option
          target:
            entity_id: select.parmair_mac_control_state
          data:
            option: Fireplace

# 1) Quick Controls card
# --------------------------------------------------
type: entities
title: Parmair Quick Controls
show_header_toggle: false
entities:
  - entity: select.parmair_mac_control_state
  - entity: select.parmair_mac_manual_speed_control
  - entity: select.parmair_mac_home_speed_preset
  - entity: select.parmair_mac_away_speed_preset
  - entity: select.parmair_mac_boost_speed_preset
  - entity: switch.parmair_mac_post_heater

